<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Pet Diary</title>
<link rel="stylesheet" href="/shared.css" />
</head>
<body class="pet-page">
<div class="wrap wide">
  <div id="langSwitch"></div>
  <nav class="tabs backnav"><a href="/index.html" data-i18n="back_all_pets"></a></nav>

  <header class="page pet-header">
    <div class="pet-header-avatar" id="petAvatar">…</div>
    <div class="pet-header-info">
      <h1 id="petname">…</h1>
      <p id="petmeta"></p>
      <button type="button" class="linkbtn" id="editPet" data-i18n="edit_details"></button>
    </div>
  </header>

  <div class="card pet-form-card" id="editCard" style="display:none; margin-bottom:16px">
    <div class="step">
      <h3 data-i18n="edit_details"></h3>
      <div id="eAvatarMount"></div>
      <div class="petform">
        <input type="text" id="eName" data-i18n-ph="name_label_ph" />
        <select id="eSpecies"></select>
        <input type="text" id="eSpeciesOther" data-i18n-ph="species_other_ph" style="display:none" />
        <div class="breed-combobox" id="eBreedBox" style="display:none">
          <input type="search" id="eBreed" data-i18n-ph="breed_ph" autocomplete="off"
                 role="combobox" aria-autocomplete="list" aria-expanded="false"
                 aria-controls="eBreedOptions" />
          <div class="breed-options" id="eBreedOptions" role="listbox" hidden></div>
        </div>
      </div>
      <div class="rowbtns">
        <button id="savePet" data-i18n="save"></button>
        <button class="ghost" id="cancelEdit" data-i18n="cancel"></button>
      </div>
    </div>
  </div>

  <div class="workspace" id="workspace">
    <nav class="subtabs" id="subtabs">
      <button data-tab="chat" class="active" data-i18n="tab_chat"></button>
      <button data-tab="log" data-i18n="tab_log"></button>
      <button data-tab="docs" data-i18n="tab_docs"></button>
    </nav>

    <!-- ── CHAT ────────────────────────────────────────────────────── -->
    <section class="panel panel-chat card" id="tab-chat">
      <div class="panel-head"><span class="panel-icon">💬</span><h3 data-i18n="tab_chat"></h3></div>
      <div class="sessionbar">
        <select id="sessionSel" data-i18n-title="your_chats"></select>
        <button type="button" class="ghost" id="newChat" data-i18n="new_chat"></button>
        <button type="button" class="ghost" id="delChat" data-i18n-title="del_chat_title">🗑</button>
      </div>
      <div class="chat">
        <div class="log" id="chatlog"></div>
        <form class="composer" id="composer">
          <textarea id="input" rows="1" autofocus></textarea>
          <button type="submit" id="send" data-i18n="send"></button>
        </form>
        <p class="choicehint" id="choicehint"></p>
      </div>
    </section>

    <!-- ── LOG (entries + the report generated from them) ──────────── -->
    <section class="panel panel-log card hidden" id="tab-log">
      <div class="panel-head"><span class="panel-icon">📒</span><h3 data-i18n="tab_log"></h3></div>
      <div class="panel-body">
        <div class="step">
          <p class="hint" id="logCount"></p>
          <div class="rowbtns">
            <button id="run" data-i18n="create_report"></button>
            <button class="ghost" id="dlLog" data-i18n="dl_log"></button>
          </div>
        </div>
        <div id="analyzeOut" style="display:none">
          <div id="flags"></div>
          <div class="report" id="report"></div>
          <div class="step" style="padding-top:0">
            <div class="rowbtns">
              <button id="saveReport" data-i18n="save_to_docs"></button>
              <button class="ghost" id="dlReport" data-i18n="dl_txt"></button>
              <button class="ghost" id="closeReport" data-i18n="close_report"></button>
            </div>
          </div>
        </div>
        <div class="doclist" id="entrylist"></div>
      </div>
    </section>

    <!-- ── DOCUMENTS ───────────────────────────────────────────────── -->
    <section class="panel panel-docs card hidden" id="tab-docs">
      <div class="panel-head"><span class="panel-icon">📁</span><h3 data-i18n="tab_docs"></h3></div>
      <div class="panel-body">
        <div class="step">
          <h4 data-i18n="add_note"></h4>
          <input type="text" id="noteTitle" data-i18n-ph="note_title_ph" style="width:100%" />
          <textarea id="noteBody" rows="3" data-i18n-ph="note_body_ph" style="width:100%; margin-top:8px; max-height:none"></textarea>
          <div class="rowbtns">
            <button id="saveNote" data-i18n="save_note"></button>
            <button class="ghost" id="attachBtn" data-i18n="attach"></button>
            <input type="file" id="fileInput" style="display:none" multiple />
          </div>
          <p class="hint" data-i18n="attach_hint"></p>
        </div>
        <div class="doclist" id="doclist"></div>
      </div>
    </section>

  </div>

  <p class="note" data-i18n="pet_note"></p>
</div>

<dialog class="log-dialog" id="logDialog">
  <form id="logDialogForm">
    <div class="dialog-head">
      <div>
        <h2 data-i18n="log_dialog_title"></h2>
        <p data-i18n="log_dialog_hint"></p>
      </div>
      <button type="button" class="dialog-close" id="closeLogDialog"
              data-i18n-title="close">×</button>
    </div>
    <div class="log-dialog-fields">
      <label class="ffield">
        <span data-i18n="f_behavior"></span>
        <input type="text" data-log-field="behavior_type" />
      </label>
      <label class="ffield">
        <span data-i18n="f_trigger"></span>
        <input type="text" data-log-field="trigger" />
      </label>
      <label class="ffield">
        <span data-i18n="f_when"></span>
        <input type="text" data-log-field="timestamp" />
      </label>
      <label class="ffield">
        <span data-i18n="f_duration"></span>
        <input type="text" data-log-field="duration" />
      </label>
      <label class="ffield">
        <span data-i18n="f_intensity"></span>
        <input type="number" min="1" max="10" step="1" data-log-field="intensity" />
        <small data-i18n="intensity_midpoint"></small>
      </label>
      <label class="ffield">
        <span data-i18n="f_recovery"></span>
        <input type="text" data-log-field="recovery_period" />
      </label>
    </div>
    <div class="dialog-actions">
      <button type="button" class="ghost" id="cancelLogDialog" data-i18n="cancel"></button>
      <button type="submit" id="saveLogDialog" data-i18n="save_to_log"></button>
    </div>
  </form>
</dialog>

<script src="/db.js"></script>
<script src="/i18n.js"></script>
<script src="/species.js"></script>
<script src="/app.js"></script>
<script src="/avatar.js"></script>
<script src="/markdown.js"></script>
<script>
  const petId = new URLSearchParams(location.search).get("id");
  let pet = null;
  function petContext() { return { name: pet.name, species: pet.species, breed: pet.breed || "" }; }
  function langNow() { return getLang(); }

  // ── Tabs ────────────────────────────────────────────────────────────
  // All three panels render side by side on wide screens; on narrow screens
  // this switches which single panel is visible (see the CSS media query).
  document.querySelectorAll(".subtabs button").forEach(btn => {
    btn.addEventListener("click", () => {
      document.querySelectorAll(".subtabs button").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      for (const name of ["chat", "log", "docs"]) {
        document.getElementById("tab-" + name).classList.toggle("hidden", name !== btn.dataset.tab);
      }
    });
  });

  // ── Chat: sessions ──────────────────────────────────────────────────
  const chatlog = document.getElementById("chatlog");
  const input = document.getElementById("input");
  const sendBtn = document.getElementById("send");
  const sessionSel = document.getElementById("sessionSel");
  const hintEl = document.getElementById("choicehint");
  const logDialog = document.getElementById("logDialog");
  const logDialogForm = document.getElementById("logDialogForm");
  const saveLogDialog = document.getElementById("saveLogDialog");

  let session = null;
  let activeLogDraft = null;
  let messageRows = [];
  let activePath = [];
  let activeGeneration = null;

  async function refreshSessions(selectId) {
    const sessions = await listSessions(petId);
    sessionSel.innerHTML = "";
    for (const s of sessions) {
      const o = document.createElement("option");
      o.value = s.id;
      o.textContent = `${s.title}  ·  ${fmtDate(s.updated_at)}`;
      sessionSel.appendChild(o);
    }
    if (selectId) sessionSel.value = selectId;
    sessionSel.style.display = sessions.length ? "block" : "none";
    return sessions;
  }

  async function openSession(id) {
    if (activeGeneration) {
      activeGeneration.discard = true;
      activeGeneration.controller.abort();
    }
    session = await getSession(id);
    const tree = await ensureMessageTree(session);
    session = tree.session;
    messageRows = tree.messages;
    activePath = pathToLeaf(session.active_leaf_id);
    sessionSel.value = id;
    renderActiveChat();
    setHint();
  }

  function renderActiveChat() {
    chatlog.innerHTML = "";
    if (!activePath.length) greet();
    for (const message of activePath) renderStored(message);
    chatlog.scrollTop = chatlog.scrollHeight;
  }

  function pathToLeaf(leafId) {
    const byId = new Map(messageRows.map(message => [message.id, message]));
    const path = [];
    const seen = new Set();
    let current = byId.get(leafId);
    while (current && !seen.has(current.id)) {
      seen.add(current.id);
      path.push(current);
      current = byId.get(current.parent_id);
    }
    return path.reverse();
  }

  function variantsFor(message) {
    return messageRows.filter(candidate =>
      candidate.parent_id === message.parent_id &&
      candidate.role === message.role &&
      candidate.kind === message.kind
    );
  }

  function latestLeafFrom(messageId) {
    let currentId = messageId;
    const seen = new Set();
    while (currentId && !seen.has(currentId)) {
      seen.add(currentId);
      const children = messageRows
        .filter(message => message.parent_id === currentId)
        .sort((a, b) => String(a.created_at).localeCompare(String(b.created_at)));
      if (!children.length) break;
      currentId = children[children.length - 1].id;
    }
    return currentId;
  }

  async function activateVariant(messageId) {
    if (activeGeneration) return;
    const leafId = latestLeafFrom(messageId);
    session = await touchSession(session, { active_leaf_id: leafId });
    activePath = pathToLeaf(leafId);
    renderActiveChat();
  }

  async function newSession() {
    const s = await createSession(petId, t("new_chat_title"));
    await refreshSessions(s.id);
    await openSession(s.id);
    input.focus();
  }

  sessionSel.addEventListener("change", () => openSession(sessionSel.value));
  document.getElementById("newChat").addEventListener("click", newSession);
  document.getElementById("delChat").addEventListener("click", async () => {
    if (!session) return;
    if (!confirm(t("confirm_del_chat", { name: pet.name }))) return;
    await deleteSession(session.id);
    const rest = await refreshSessions();
    if (rest.length) await openSession(rest[0].id); else await newSession();
  });

  // ── Rendering ───────────────────────────────────────────────────────
  function greet() {
    const d = document.createElement("div");
    d.className = "msg assistant";
    d.textContent = t("greet", { name: pet.name });
    chatlog.appendChild(d);
  }

  function renderStored(m) {
    if (m.kind === "summary") {
      try { return renderSummary(JSON.parse(m.content), m.id); }
      catch { return bubble(m.content, "assistant"); }
    }
    if (m.role === "user") return renderUser(m);
    return m.kind === "log"
      ? bubble(m.content, "assistant")
      : renderAssistant(m);
  }

  function bubble(text, cls) {
    const d = document.createElement("div");
    d.className = "msg " + cls;
    d.textContent = text;
    chatlog.appendChild(d);
    chatlog.scrollTop = chatlog.scrollHeight;
    return d;
  }

  function buildAdviceBubble(text, thinking = "", thoughtSeconds = null) {
    const d = document.createElement("div");
    d.className = "msg advice";
    if (thinking) {
      const details = document.createElement("details");
      details.className = "thinking-panel";
      const summary = document.createElement("summary");
      summary.textContent = thoughtSeconds === null
        ? t("thinking_process")
        : t("thought_for", { s: thoughtSeconds });
      const body = document.createElement("div");
      body.className = "thinking-body";
      renderMarkdown(body, thinking);
      details.append(summary, body);
      d.appendChild(details);

      const answer = document.createElement("div");
      answer.className = "advice-answer";
      renderMarkdown(answer, text);
      d.appendChild(answer);
    } else {
      renderMarkdown(d, text);
    }
    return d;
  }

  function adviceBubble(text, thinking = "", thoughtSeconds = null) {
    const d = buildAdviceBubble(text, thinking, thoughtSeconds);
    chatlog.appendChild(d);
    chatlog.scrollTop = chatlog.scrollHeight;
    return d;
  }

  function renderAssistant(m) {
    const wrap = document.createElement("div");
    wrap.className = "assistantgroup";
    wrap.dataset.msgId = m.id;
    wrap.appendChild(buildAdviceBubble(m.content, m.thinking, m.thought_seconds ?? null));

    const actions = document.createElement("div");
    actions.className = "msgactions assistant-actions";
    appendBranchControl(actions, m);
    appendAction(actions, t("copy_answer"), () => copyAnswer(m.content, actions));
    appendAction(actions, t("regenerate"), () => regenerate(m));
    wrap.appendChild(actions);
    chatlog.appendChild(wrap);
    return wrap;
  }

  // Every message you send carries its own "add to log" decision.
  function renderUser(m) {
    const wrap = document.createElement("div");
    wrap.className = "usergroup";
    wrap.dataset.msgId = m.id;
    const d = document.createElement("div");
    d.className = "msg user";
    d.textContent = m.content;
    wrap.appendChild(d);

    const act = document.createElement("div");
    act.className = "msgactions user-actions";
    appendBranchControl(act, m);
    appendAction(act, t("edit_message"), () => editUserMessage(wrap, m));
    const logSlot = document.createElement("span");
    logSlot.className = "log-action";
    if (m.entry_id) {
      loggedButton(logSlot, m);
    } else if (m.kind === "advice") {
      addButton(logSlot, m);
    }
    act.appendChild(logSlot);
    wrap.appendChild(act);
    chatlog.appendChild(wrap);
    chatlog.scrollTop = chatlog.scrollHeight;
    return wrap;
  }

  function appendAction(container, label, handler, className = "linkbtn") {
    const button = document.createElement("button");
    button.type = "button";
    button.className = className;
    button.textContent = label;
    button.onclick = handler;
    container.appendChild(button);
    return button;
  }

  function appendBranchControl(container, message) {
    const variants = variantsFor(message);
    if (variants.length < 2) return;
    const index = variants.findIndex(candidate => candidate.id === message.id);
    const control = document.createElement("span");
    control.className = "branch-control";
    const previous = appendAction(
      control, "‹", () => activateVariant(variants[(index - 1 + variants.length) % variants.length].id)
    );
    previous.title = t("previous_version");
    const count = document.createElement("span");
    count.textContent = `${index + 1} / ${variants.length}`;
    control.appendChild(count);
    const next = appendAction(
      control, "›", () => activateVariant(variants[(index + 1) % variants.length].id)
    );
    next.title = t("next_version");
    container.appendChild(control);
  }

  async function copyAnswer(text, actions) {
    try {
      if (navigator.clipboard && window.isSecureContext) {
        await navigator.clipboard.writeText(text);
      } else {
        const helper = document.createElement("textarea");
        helper.value = text;
        helper.style.position = "fixed";
        helper.style.opacity = "0";
        document.body.appendChild(helper);
        helper.select();
        document.execCommand("copy");
        helper.remove();
      }
      const copyButton = Array.from(actions.querySelectorAll("button"))
        .find(button => button.textContent === t("copy_answer"));
      if (copyButton) {
        copyButton.textContent = t("copied");
        setTimeout(() => { copyButton.textContent = t("copy_answer"); }, 1500);
      }
    } catch {
      // The browser can deny clipboard access; leave the action available to retry.
    }
  }

  function editUserMessage(wrap, message) {
    if (activeGeneration) return;
    const bubbleElement = wrap.querySelector(".msg.user");
    const actions = wrap.querySelector(".msgactions");
    bubbleElement.hidden = true;
    actions.hidden = true;

    const form = document.createElement("form");
    form.className = "message-edit-form";
    const textarea = document.createElement("textarea");
    textarea.rows = 2;
    textarea.value = message.content;
    const buttons = document.createElement("div");
    buttons.className = "rowbtns";
    appendAction(buttons, t("cancel"), () => {
      form.remove();
      bubbleElement.hidden = false;
      actions.hidden = false;
    }, "ghost");
    const save = appendAction(buttons, t("save_and_send"), () => {}, "");
    save.type = "submit";
    form.append(textarea, buttons);
    form.addEventListener("submit", async event => {
      event.preventDefault();
      const content = textarea.value.trim();
      if (!content || activeGeneration) return;
      const edited = await say("user", "advice", content, {
        parent_id: message.parent_id,
        render: false,
      });
      activePath = pathToLeaf(edited.id);
      renderActiveChat();
      await runAdvice(edited);
    });
    wrap.appendChild(form);
    textarea.focus();
    textarea.setSelectionRange(textarea.value.length, textarea.value.length);
  }

  function summaryHTML(r) {
    return `
      <h3>${t("written_down", { name: esc(pet.name) })}</h3>
      <dl>
        <dt>${t("f_behavior")}</dt><dd>${esc(fmt(r.behavior_type))}</dd>
        <dt>${t("f_trigger")}</dt><dd>${esc(fmt(r.trigger))}</dd>
        <dt>${t("f_when")}</dt><dd>${esc(fmt(r.timestamp))}</dd>
        <dt>${t("f_duration")}</dt><dd>${esc(fmt(r.duration))}</dd>
        <dt>${t("f_intensity")}</dt><dd>${esc(fmt(r.intensity))}</dd>
        <dt>${t("f_recovery")}</dt><dd>${esc(fmt(r.recovery_period))}</dd>
      </dl>`;
  }

  function renderSummary(r, msgId) {
    const wrap = document.createElement("div");
    wrap.className = "msg summary";
    if (msgId) wrap.dataset.summaryId = msgId;
    wrap.innerHTML = summaryHTML(r);
    chatlog.appendChild(wrap);
    chatlog.scrollTop = chatlog.scrollHeight;
  }

  function busy(on) { sendBtn.disabled = on; }
  function setHint() { hintEl.textContent = t("hint_free"); }

  async function say(role, kind, content, options = {}) {
    const parentId = Object.prototype.hasOwnProperty.call(options, "parent_id")
      ? options.parent_id
      : (session.active_leaf_id || null);
    const m = await addMessage(session.id, petId, {
      role,
      kind,
      content,
      entry_id: options.entry_id || null,
      thinking: options.thinking || null,
      thought_seconds: options.thought_seconds ?? null,
      parent_id: parentId,
    });
    messageRows.push(m);
    session = await touchSession(session, { active_leaf_id: m.id });
    activePath = pathToLeaf(m.id);
    if (options.render !== false) renderActiveChat();
    return m;
  }

  // ── Sending ─────────────────────────────────────────────────────────
  document.getElementById("composer").addEventListener("submit", async (e) => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text || sendBtn.disabled) return;
    input.value = ""; input.style.height = "auto";

    if (!session) await newSession();
    if (!messageRows.length) {
      session = await touchSession(session, { title: text.slice(0, 40) + (text.length > 40 ? "…" : "") });
      await refreshSessions(session.id);
    } else {
      session = await touchSession(session);
    }

    const userMessage = await say("user", "advice", text);
    await runAdvice(userMessage);
  });

  async function regenerate(message) {
    if (activeGeneration) return;
    const userMessage = messageRows.find(candidate => candidate.id === message.parent_id);
    if (!userMessage) return;
    session = await touchSession(session, { active_leaf_id: userMessage.id });
    activePath = pathToLeaf(userMessage.id);
    renderActiveChat();
    await runAdvice(userMessage);
  }

  async function runAdvice(parentUser) {
    if (activeGeneration) return;
    busy(true);
    const controller = new AbortController();
    const startedAt = Date.now();
    const generation = {
      controller,
      parentId: parentUser.id,
      sessionId: session.id,
      discard: false,
    };
    activeGeneration = generation;
    const pending = createStreamingReply(controller);
    let thinking = "";
    let answer = "";
    let streamError = "";

    try {
      const history = activePath
        .filter(m => m.kind === "advice")
        .map(m => ({ role: m.role, content: m.content }));
      const res = await fetchAdviceStream({
        messages: history,
        pet: petContext(),
        lang: langNow(),
      }, controller.signal);

      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buffer = "";
      while (true) {
        const { done, value } = await reader.read();
        buffer += decoder.decode(value || new Uint8Array(), { stream: !done });
        const lines = buffer.split("\n");
        buffer = done ? "" : lines.pop();
        for (const raw of lines) {
          if (!raw.trim()) continue;
          const event = JSON.parse(raw);
          if (event.type === "thinking") {
            thinking += event.delta || "";
            pending.queuedThinking += event.delta || "";
          }
          if (event.type === "answer") {
            answer += event.delta || "";
            pending.queuedAnswer += event.delta || "";
          }
          if (event.type === "error") streamError = chatFailureMessage(event);
          if (event.type === "timeout") streamError = t("stream_timeout");
          queueStreamingFlush(pending, startedAt);
        }
        if (done) break;
      }
      if (streamError && !answer && !thinking) throw new Error(streamError);
    } catch (error) {
      if (error.name !== "AbortError") streamError = error.message || t("err_unreachable");
    } finally {
      if (pending.flushTimer !== null) clearTimeout(pending.flushTimer);
      flushStreamingReply(pending, startedAt);
      const stopped = controller.signal.aborted;
      if (activeGeneration === generation) activeGeneration = null;
      busy(false);

      if (!generation.discard && session.id === generation.sessionId && (answer || thinking || stopped)) {
        const finalAnswer = answer
          ? answer + (streamError ? `\n\n_${streamError}_` : "")
          : (stopped ? t("generation_stopped") : streamError || t("err_generic"));
        const savedMessage = await say("assistant", "advice", finalAnswer, {
          parent_id: parentUser.id,
          thinking,
          thought_seconds: Math.max(1, Math.round((Date.now() - startedAt) / 1000)),
          render: false,
        });
        finalizeStreamingReply(pending, savedMessage);
      } else if (!generation.discard && session.id === generation.sessionId && streamError && !stopped) {
        pending.wrap.remove();
        renderGenerationError(streamError, parentUser);
      } else {
        pending.wrap.remove();
      }
    }
  }

  async function fetchAdviceStream(payload, signal) {
    const retryable = new Set(["rate_limited", "provider_unavailable", "network_error"]);
    for (let attempt = 0; attempt < 2; attempt += 1) {
      let response;
      try {
        response = await fetch("/api/advise-stream", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify(payload),
          signal,
        });
      } catch (error) {
        if (error.name === "AbortError") throw error;
        if (attempt === 1) throw new Error(t("chat_error_network_error"));
        await new Promise(resolve => setTimeout(resolve, 350));
        continue;
      }

      if (response.ok && response.body) return response;
      const failure = await response.json().catch(() => ({}));
      if (attempt === 0 && retryable.has(failure.code)) {
        await new Promise(resolve => setTimeout(resolve, 350));
        continue;
      }
      throw new Error(chatFailureMessage(failure));
    }
    throw new Error(t("err_unreachable"));
  }

  function chatFailureMessage(failure) {
    const key = failure && failure.code ? `chat_error_${failure.code}` : "";
    if (key && I18N.en[key]) return t(key);
    return failure && failure.error ? failure.error : t("err_generic");
  }

  function renderGenerationError(error, parentUser) {
    const wrap = document.createElement("div");
    wrap.className = "assistantgroup";
    const message = document.createElement("div");
    message.className = "msg assistant error";
    message.textContent = error;
    const actions = document.createElement("div");
    actions.className = "msgactions assistant-actions";
    appendAction(actions, t("retry"), () => {
      wrap.remove();
      runAdvice(parentUser);
    });
    wrap.append(message, actions);
    chatlog.appendChild(wrap);
    chatlog.scrollTop = chatlog.scrollHeight;
  }

  function createStreamingReply(controller) {
    const wrap = document.createElement("div");
    wrap.className = "assistantgroup streaming";
    const bubbleElement = document.createElement("div");
    bubbleElement.className = "msg advice";
    const status = document.createElement("div");
    status.className = "stream-status";
    status.textContent = t("thinking");

    const details = document.createElement("details");
    details.className = "thinking-panel stream-content";
    details.hidden = true;
    const summary = document.createElement("summary");
    summary.textContent = t("thinking");
    const thinkingBody = document.createElement("div");
    thinkingBody.className = "thinking-body";
    const thinkingRenderer = createStreamingMarkdownRenderer(thinkingBody);
    details.append(summary, thinkingBody);

    const answerElement = document.createElement("div");
    answerElement.className = "advice-answer";
    answerElement.hidden = true;
    const answerRenderer = createStreamingMarkdownRenderer(answerElement);
    bubbleElement.append(status, details, answerElement);

    const actions = document.createElement("div");
    actions.className = "msgactions assistant-actions";
    appendAction(actions, t("stop_generating"), () => controller.abort(), "stop-generation");
    wrap.append(bubbleElement, actions);
    chatlog.appendChild(wrap);
    chatlog.scrollTop = chatlog.scrollHeight;
    return {
      wrap,
      bubbleElement,
      status,
      details,
      summary,
      thinkingRenderer,
      answerElement,
      answerRenderer,
      actions,
      queuedThinking: "",
      queuedAnswer: "",
      flushTimer: null,
      hasThinking: false,
      hasAnswer: false,
    };
  }

  function queueStreamingFlush(pending, startedAt) {
    if (pending.flushTimer !== null) return;
    pending.flushTimer = setTimeout(() => flushStreamingReply(pending, startedAt), 100);
  }

  function flushStreamingReply(pending, startedAt) {
    if (pending.flushTimer !== null) clearTimeout(pending.flushTimer);
    pending.flushTimer = null;
    if (!pending.queuedThinking && !pending.queuedAnswer) return;

    const followOutput = chatlog.scrollHeight - chatlog.scrollTop - chatlog.clientHeight < 120;
    if (pending.queuedThinking) {
      if (!pending.hasThinking) {
        pending.hasThinking = true;
        pending.status.remove();
        pending.details.hidden = false;
        pending.details.open = !pending.hasAnswer;
      }
      pending.thinkingRenderer.append(pending.queuedThinking);
      pending.queuedThinking = "";
    }
    if (pending.queuedAnswer) {
      if (!pending.hasAnswer) {
        pending.hasAnswer = true;
        pending.status.remove();
        pending.answerElement.hidden = false;
        pending.details.open = false;
      }
      pending.answerRenderer.append(pending.queuedAnswer);
      pending.queuedAnswer = "";
    }
    if (pending.hasThinking) {
      const seconds = Math.max(1, Math.round((Date.now() - startedAt) / 1000));
      pending.summary.textContent = pending.hasAnswer
        ? t("thought_for", { s: seconds })
        : t("thinking");
    }
    if (followOutput) chatlog.scrollTop = chatlog.scrollHeight;
  }

  function finalizeStreamingReply(pending, message) {
    const followOutput = chatlog.scrollHeight - chatlog.scrollTop - chatlog.clientHeight < 120;
    const finalBubble = buildAdviceBubble(
      message.content,
      message.thinking,
      message.thought_seconds ?? null
    );
    pending.bubbleElement.replaceWith(finalBubble);
    pending.actions.innerHTML = "";
    appendBranchControl(pending.actions, message);
    appendAction(pending.actions, t("copy_answer"), () => copyAnswer(message.content, pending.actions));
    appendAction(pending.actions, t("regenerate"), () => regenerate(message));
    pending.wrap.classList.remove("streaming");
    pending.wrap.dataset.msgId = message.id;
    if (followOutput) chatlog.scrollTop = chatlog.scrollHeight;
  }

  // Logging is separate from the conversation: extract what is already known,
  // let the owner review every field in a dialog, then save exactly one entry
  // linked to the source message.
  function addButton(act, m) {
    act.innerHTML = "";
    const b = document.createElement("button");
    b.type = "button";
    b.className = "linkbtn";
    b.textContent = t("add_to_log");
    b.onclick = () => prepareLog(m, act);
    act.appendChild(b);
  }

  function loggedButton(act, m) {
    act.innerHTML = "";
    const b = document.createElement("button");
    b.type = "button";
    b.className = "linkbtn logged";
    b.textContent = t("added_edit_log");
    b.onclick = () => editLinkedLog(m, act);
    act.appendChild(b);
  }

  async function prepareLog(m, act) {
    act.innerHTML = `<span class="logged">${t("adding")}</span>`;
    try {
      const thread = activePath.filter(message => message.kind === "advice");
      const targetIndex = thread.findIndex(message => message.id === m.id);
      const context = (targetIndex >= 0 ? thread.slice(0, targetIndex + 1) : [m])
        .slice(-12)
        .map(message => ({ role: message.role, content: message.content }));
      const res = await fetch("/.netlify/functions/chat", {
        method: "POST", headers: { "content-type": "application/json" },
        body: JSON.stringify({ messages: context }),
      });
      const data = await res.json();
      if (!res.ok) { addFailed(act, m); return; }
      if (!data.has_observation) {
        act.innerHTML = `<span class="logged">${t("nothing_to_log")}</span>`;
        return;
      }
      addButton(act, m);
      openLogDialog(m, act, data);
    } catch {
      addFailed(act, m);
    }
  }

  async function editLinkedLog(m, act) {
    const entry = await getEntry(m.entry_id);
    if (!entry) {
      m.entry_id = null;
      await markMessageLogged(m.id, null);
      addButton(act, m);
      return;
    }
    openLogDialog(m, act, entry);
  }

  function openLogDialog(m, act, record) {
    activeLogDraft = { message: m, action: act };
    logDialog.querySelectorAll("[data-log-field]").forEach(field => {
      field.value = record[field.dataset.logField] ?? "";
    });
    logDialog.showModal();
    logDialog.querySelector('[data-log-field="behavior_type"]').focus();
  }

  function closeLogDialog() {
    if (logDialog.open) logDialog.close();
  }

  document.getElementById("closeLogDialog").onclick = closeLogDialog;
  document.getElementById("cancelLogDialog").onclick = closeLogDialog;
  logDialog.addEventListener("close", () => { activeLogDraft = null; });
  logDialog.addEventListener("click", event => {
    if (event.target !== logDialog) return;
    const rect = logDialog.getBoundingClientRect();
    const inside = event.clientX >= rect.left && event.clientX <= rect.right &&
      event.clientY >= rect.top && event.clientY <= rect.bottom;
    if (!inside) closeLogDialog();
  });

  logDialogForm.addEventListener("submit", async event => {
    event.preventDefault();
    if (!activeLogDraft || saveLogDialog.disabled) return;

    const fields = {};
    logDialog.querySelectorAll("[data-log-field]").forEach(field => {
      fields[field.dataset.logField] = field.value.trim();
    });
    if (!fields.behavior_type) {
      alert(t("behavior_required"));
      logDialog.querySelector('[data-log-field="behavior_type"]').focus();
      return;
    }
    if (fields.intensity !== "" &&
        !(Number.isInteger(Number(fields.intensity)) &&
          Number(fields.intensity) >= 1 && Number(fields.intensity) <= 10)) {
      alert(t("bad_intensity"));
      logDialog.querySelector('[data-log-field="intensity"]').focus();
      return;
    }

    const draft = activeLogDraft;
    saveLogDialog.disabled = true;
    try {
      const entry = await saveEntryForMessage(petId, draft.message.id, fields);
      if (!entry) throw new Error("No log entry was saved.");
      draft.message.entry_id = entry.id;
      loggedButton(draft.action, draft.message);
      closeLogDialog();
      await refreshMeta();
      await renderEntries();
    } catch {
      alert(t("save_log_failed"));
    } finally {
      saveLogDialog.disabled = false;
    }
  });

  // Surface the failure on the message itself rather than as a chat message.
  function addFailed(act, m) {
    act.innerHTML = "";
    const span = document.createElement("span");
    span.className = "error";
    span.textContent = t("add_failed") + " ";
    const retry = document.createElement("button");
    retry.type = "button"; retry.className = "linkbtn"; retry.textContent = t("retry");
    retry.onclick = () => prepareLog(m, act);
    act.appendChild(span); act.appendChild(retry);
  }

  input.addEventListener("input", () => { input.style.height = "auto"; input.style.height = input.scrollHeight + "px"; });
  input.addEventListener("keydown", e => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); document.getElementById("composer").requestSubmit(); }
  });

  // ── Documents ───────────────────────────────────────────────────────
  async function renderDocs() {
    const [docs, atts] = await Promise.all([listDocuments(petId), listAttachments(petId)]);
    const el = document.getElementById("doclist");
    if (!docs.length && !atts.length) {
      el.innerHTML = `<div class="empty">${t("no_docs")}<br />${t("no_docs_sub")}</div>`;
      return;
    }
    el.innerHTML = "";
    for (const d of docs) {
      const item = document.createElement("div");
      item.className = "docitem";
      item.innerHTML = `
        <h4>${d.kind === "report" ? "📄" : "📝"} ${esc(d.title)}</h4>
        <div class="meta">${d.kind === "report" ? t("doc_report") : t("doc_note")} · ${fmtDate(d.created_at)}</div>
        <details><summary>${t("read")}</summary><div class="body">${esc(d.body)}</div></details>
        <div class="actions">
          <button class="ghost dl">${t("download")}</button>
          <button class="ghost del">${t("delete")}</button>
        </div>`;
      item.querySelector(".dl").onclick = () =>
        download(d.body, `${d.title.replace(/[^a-z0-9]+/gi, "_").toLowerCase()}.txt`, "text/plain");
      item.querySelector(".del").onclick = async () => {
        if (!confirm(t("confirm_del_doc", { title: d.title }))) return;
        await deleteDocument(d.id); renderDocs(); refreshMeta();
      };
      el.appendChild(item);
    }
    for (const a of atts) {
      const item = document.createElement("div");
      item.className = "docitem";
      item.innerHTML = `
        <h4>📎 ${esc(a.name)}</h4>
        <div class="meta">${esc(a.type)} · ${fileSize(a.size)} · ${fmtDate(a.created_at)}</div>
        <div class="actions">
          <button class="ghost dl">${t("download")}</button>
          <button class="ghost del">${t("delete")}</button>
        </div>`;
      item.querySelector(".dl").onclick = () => download(a.blob, a.name);
      item.querySelector(".del").onclick = async () => {
        if (!confirm(t("confirm_del_doc", { title: a.name }))) return;
        await deleteAttachment(a.id); renderDocs();
      };
      el.appendChild(item);
    }
  }

  document.getElementById("saveNote").addEventListener("click", async () => {
    const title = document.getElementById("noteTitle").value.trim();
    const body = document.getElementById("noteBody").value.trim();
    if (!title && !body) return;
    await addDocument(petId, { kind: "note", title: title || t("note_fallback"), body });
    document.getElementById("noteTitle").value = "";
    document.getElementById("noteBody").value = "";
    renderDocs(); refreshMeta();
  });
  document.getElementById("attachBtn").addEventListener("click", () => document.getElementById("fileInput").click());
  document.getElementById("fileInput").addEventListener("change", async (e) => {
    for (const file of e.target.files) await addAttachment(petId, file);
    e.target.value = "";
    renderDocs();
  });

  // ── Log: the entries added from chat ────────────────────────────────
  async function renderEntries() {
    const entries = (await listEntries(petId)).slice().reverse(); // newest first
    const n = entries.length;
    document.getElementById("logCount").textContent = n === 0
      ? t("nothing_logged", { name: pet.name })
      : nEvents(n);
    document.getElementById("run").disabled = n === 0;
    document.getElementById("dlLog").disabled = n === 0;

    const el = document.getElementById("entrylist");
    if (!n) {
      el.innerHTML = `<div class="empty">${t("no_entries")}<br />${t("no_entries_sub", { name: esc(pet.name) })}</div>`;
      return;
    }
    el.innerHTML = "";
    for (const e of entries) {
      const item = document.createElement("div");
      item.className = "docitem";
      item.innerHTML = `
        <h4>🐾 ${esc(fmt(e.behavior_type))}</h4>
        <div class="meta">${fmtDateTime(e.logged_at)}${e.edited_at ? " · " + t("edited") : ""}${e.trigger ? " · " + t("trigger_label") + ": " + esc(e.trigger) : ""}</div>
        <dl class="entryfields">
          <dt>${t("f_when")}</dt><dd>${esc(fmt(e.timestamp))}</dd>
          <dt>${t("f_duration")}</dt><dd>${esc(fmt(e.duration))}</dd>
          <dt>${t("f_intensity")}</dt><dd>${esc(fmt(e.intensity))}</dd>
          <dt>${t("f_recovery")}</dt><dd>${esc(fmt(e.recovery_period))}</dd>
        </dl>
        <div class="actions">
          <button class="ghost edit">${t("edit")}</button>
          <button class="ghost del">${t("delete")}</button>
        </div>`;
      item.querySelector(".edit").onclick = () => editEntry(item, e);
      item.querySelector(".del").onclick = async () => {
        if (!confirm(t("confirm_del_entry"))) return;
        await deleteEntry(e.id);
        await renderEntries();
        await refreshMeta();
        if (session) await openSession(session.id);
      };
      el.appendChild(item);
    }
  }

  // Revise an entry by hand — the assistant only captures what the message
  // mentioned, so this is how the blanks get filled in (or mistakes corrected).
  function editEntry(item, e) {
    const row = (key, field, type) => `
      <label class="ffield">
        <span>${t(key)}</span>
        <input type="${type}" data-f="${field}" ${type === "number" ? 'min="1" max="10" step="1"' : ""}
               value="${esc(e[field] ?? "")}" />
      </label>`;
    item.innerHTML = `
      <div class="entryform">
        ${row("f_behavior", "behavior_type", "text")}
        ${row("f_trigger", "trigger", "text")}
        ${row("f_when", "timestamp", "text")}
        ${row("f_duration", "duration", "text")}
        ${row("f_intensity", "intensity", "number")}
        ${row("f_recovery", "recovery_period", "text")}
      </div>
      <p class="hint">${t("edit_hint")}</p>
      <div class="actions">
        <button class="save">${t("save")}</button>
        <button class="ghost cancel">${t("cancel")}</button>
      </div>`;

    item.querySelector(".cancel").onclick = () => renderEntries();
    item.querySelector(".save").onclick = async () => {
      const fields = {};
      item.querySelectorAll("[data-f]").forEach(i => { fields[i.dataset.f] = i.value; });

      const raw = String(fields.intensity ?? "").trim();
      if (raw !== "" && !(Number.isInteger(Number(raw)) && Number(raw) >= 1 && Number(raw) <= 10)) {
        alert(t("bad_intensity"));
        return;
      }
      await updateEntry(e.id, { ...fields, edited_at: new Date().toISOString() });
      await renderEntries();
      await refreshMeta();
    };
    item.querySelector("[data-f]").focus();
  }

  document.getElementById("dlLog").addEventListener("click", async () => {
    const entries = await listEntries(petId);
    download(JSON.stringify(entries, null, 2),
      `${pet.name.toLowerCase().replace(/[^a-z0-9]+/g, "_")}_log.json`, "application/json");
  });

  // ── The report, generated from the log ──────────────────────────────
  let reportText = "";

  function buildReport(meta, body) {
    const dr = meta.date_range;
    const span = (dr.first && dr.last) ? t("report_span", { a: dr.first.slice(0,10), b: dr.last.slice(0,10) }) + "\n" : "";
    return t("report_title", { name: pet.name.toUpperCase() }) + "\n" +
      t("report_generated", { d: fmtDateLong(new Date()) }) + "\n" +
      t("report_based", { n: nEntries(meta.record_count) }) + "\n" + span +
      t("report_disclaimer") + "\n" +
      "=".repeat(70) + "\n\n" + body + "\n";
  }

  document.getElementById("run").addEventListener("click", async () => {
    const runBtn = document.getElementById("run");
    runBtn.disabled = true; runBtn.textContent = t("thinking_btn");
    const out = document.getElementById("analyzeOut");
    const rep = document.getElementById("report");
    try {
      const records = await listEntries(petId);
      const res = await fetch("/.netlify/functions/analyze", {
        method: "POST", headers: { "content-type": "application/json" },
        body: JSON.stringify({ records, pet: petContext(), lang: langNow() }),
      });
      const data = await res.json();
      if (!res.ok) {
        out.style.display = "block";
        rep.textContent = data.error || t("err_generic");
        rep.classList.add("error");
        return;
      }
      rep.classList.remove("error");
      reportText = buildReport(data, data.report_body);
      document.getElementById("flags").innerHTML = (data.flags && data.flags.length)
        ? `<div class="flags"><h4>${t("patterns_noticed")}</h4><ul>${data.flags.map(f => `<li>${esc(f)}</li>`).join("")}</ul></div>`
        : "";
      rep.textContent = reportText;
      out.style.display = "block";
      out.scrollIntoView({ behavior: "smooth", block: "nearest" });
    } catch {
      out.style.display = "block";
      rep.textContent = t("err_unreachable");
      rep.classList.add("error");
    } finally { runBtn.textContent = t("create_report"); runBtn.disabled = false; }
  });

  document.getElementById("saveReport").addEventListener("click", async () => {
    const btn = document.getElementById("saveReport");
    await addDocument(petId, { kind: "report", title: `${t("doc_report")} — ${fmtDate(new Date().toISOString())}`, body: reportText });
    btn.textContent = t("saved_check");
    setTimeout(() => btn.textContent = t("save_to_docs"), 1500);
    await refreshMeta();
  });
  document.getElementById("dlReport").addEventListener("click", () =>
    download(reportText, `${pet.name.toLowerCase()}_report_${new Date().toISOString().slice(0,10)}.txt`, "text/plain"));
  document.getElementById("closeReport").addEventListener("click", () => {
    document.getElementById("analyzeOut").style.display = "none";
  });

  // ── Editing the pet's details ───────────────────────────────────────
  const petForm = wireSpeciesBreed({
    speciesSel: document.getElementById("eSpecies"),
    speciesOther: document.getElementById("eSpeciesOther"),
    breedBox: document.getElementById("eBreedBox"),
    breedInput: document.getElementById("eBreed"),
    breedList: document.getElementById("eBreedOptions"),
  });
  const editCard = document.getElementById("editCard");
  const eAvatarPicker = createAvatarPicker(document.getElementById("eAvatarMount"), {
    getSpecies: () => petForm.getSpecies(),
  });
  document.getElementById("eSpecies").addEventListener("change", () => eAvatarPicker.refreshEmoji());
  document.getElementById("eSpeciesOther").addEventListener("input", () => eAvatarPicker.refreshEmoji());

  document.getElementById("editPet").addEventListener("click", () => {
    const open = editCard.style.display !== "none";
    if (open) { editCard.style.display = "none"; return; }
    document.getElementById("eName").value = pet.name;
    petForm.setValues(pet.species, pet.breed);
    eAvatarPicker.setValues(pet);
    editCard.style.display = "block";
    document.getElementById("eName").focus();
  });
  document.getElementById("cancelEdit").addEventListener("click", () => editCard.style.display = "none");
  document.getElementById("savePet").addEventListener("click", async () => {
    const name = document.getElementById("eName").value.trim();
    if (!name) { alert(t("ask_name")); return; }
    const species = petForm.getSpecies();
    if (!species) { alert(t("ask_species")); return; }
    pet = await updatePet({
      ...pet, name, species, breed: petForm.getBreed(),
      ...eAvatarPicker.getAvatar(),
    });
    applyPet();
    await refreshMeta();
    await renderEntries();
    editCard.style.display = "none";
  });

  // ── Boot ────────────────────────────────────────────────────────────
  async function refreshMeta() {
    const [entries, docs] = await Promise.all([listEntries(petId), listDocuments(petId)]);
    const kind = [breedLabel(pet.species, pet.breed), speciesDisplay(pet.species)].filter(Boolean).join(" · ");
    document.getElementById("petmeta").textContent =
      `${kind ? kind + " · " : ""}${entries.length} ${entries.length === 1 ? "entry" : "entries"} · ` +
      `${docs.length} ${docs.length === 1 ? "document" : "documents"}`;
  }

  // Everything that reflects the pet's name/species, in one place so an edit
  // updates the whole page.
  function applyPet() {
    document.title = `${pet.name} · ${t("app_title")}`;
    document.getElementById("petname").textContent = pet.name;
    document.getElementById("petAvatar").innerHTML = avatarHTML(pet);
    input.placeholder = t("chat_ph", { name: pet.name });
  }

  (async () => {
    pet = petId ? await getPet(petId) : null;
    if (!pet) { location.href = "/index.html"; return; }
    applyPet();
    await refreshMeta();
    // The log and documents panels sit next to chat at all times on wide
    // screens, so they need their content ready from the start.
    await renderEntries();
    await renderDocs();

    // Pick up where you left off, or start a fresh chat.
    const sessions = await refreshSessions();
    if (sessions.length) await openSession(sessions[0].id);
    else await newSession();
  })();
</script>
</body>
